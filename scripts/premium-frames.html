<!doctype html>
<!--
  The premium animated avatar frames (owner request 2026-10-25, "very valuable profile decorations"), drawn on a canvas.
  scripts/render-premium-frames.mjs calls draw(name, t) for t in [0, 1) and saves each frame; scripts/make-premium-frames.py
  joins them into public/frames/<name>.webp (animated, looping). Every motion uses whole turns of t, so the loop has no seam.
  The opening (where the avatar shows) is the rounded square from 66 to 446 on the 512 canvas: frameArt opening 0.74.
-->
<meta charset="utf-8" />
<body style="margin:0;background:transparent">
<canvas id="c" width="512" height="512"></canvas>
<script>
const c = document.getElementById("c")
const g = c.getContext("2d")
const TAU = Math.PI * 2
const C = 256
const H = 190 // half the opening
const R = 34 // its corner radius

function rr(x, y, w, h, r, fresh = true) {
  if (fresh) g.beginPath()
  g.moveTo(x + r, y)
  g.arcTo(x + w, y, x + w, y + h, r)
  g.arcTo(x + w, y + h, x, y + h, r)
  g.arcTo(x, y + h, x, y, r)
  g.arcTo(x, y, x + w, y, r)
  g.closePath()
}
const square = (half, r = R) => rr(C - half, C - half, half * 2, half * 2, r)
/** The band between two squares, as one path (fill or clip it with "evenodd"): never covers the opening. */
function ring(outer, outerR, inner, innerR = R) {
  rr(C - outer, C - outer, outer * 2, outer * 2, outerR)
  rr(C - inner, C - inner, inner * 2, inner * 2, innerR, false)
}
/** A point on the square of half-size `half` at share s of its edge (0 = top left, clockwise), with the outward normal. */
function onEdge(s, half) {
  const side = Math.floor(((s % 1) + 1) % 1 * 4)
  const f = ((((s % 1) + 1) % 1) * 4) % 1
  const a = -half + f * half * 2
  return [[C + a, C - half, 0, -1], [C + half, C + a, 1, 0], [C - a, C + half, 0, 1], [C - half, C - a, -1, 0]][side]
}
/** A small seeded random, so a frame is the same every time it is drawn. */
function rand(seed) { const x = Math.sin(seed * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x) }
function star(x, y, r, color, glow) {
  g.save(); g.translate(x, y); g.fillStyle = color; g.shadowColor = glow; g.shadowBlur = r * 2.5
  g.beginPath()
  for (let i = 0; i < 8; i++) { const a = i * TAU / 8; const d = i % 2 ? r * 0.22 : r; g.lineTo(Math.cos(a - TAU / 4) * d, Math.sin(a - TAU / 4) * d) }
  g.closePath(); g.fill(); g.restore()
}
function metal(half, width, stops, angle = 0) {
  const grad = g.createLinearGradient(C + Math.cos(angle) * -260, C + Math.sin(angle) * -260, C + Math.cos(angle) * 260, C + Math.sin(angle) * 260)
  stops.forEach((color, i) => grad.addColorStop(i / (stops.length - 1), color))
  g.save(); square(half); g.lineWidth = width; g.strokeStyle = grad; g.stroke(); g.restore()
}

const designs = {
  /** Dragon Ember: an iron border wrapped in living flame, embers rising off it. */
  "dragon-ember"(t) {
    // Fire: many soft blobs leaving the border, rising and cooling from white-yellow to red as they go (added light).
    g.save(); g.globalCompositeOperation = "lighter"
    // A hot glow hugging the border, under the flames.
    g.save(); square(H + 12); g.lineWidth = 26; g.strokeStyle = "rgba(255,90,0,0.35)"; g.shadowColor = "#ff4500"; g.shadowBlur = 40; g.stroke(); g.restore()
    for (let k = 0; k < 560; k++) {
      const life = (t * (1 + (k % 3)) + rand(k)) % 1
      const [x, y, nx, ny] = onEdge(rand(k + 1000), H + 10)
      const reach = 18 + rand(k + 7) * 26 + (ny < 0 ? 34 : 0)
      const sway = Math.sin(TAU * (life * 1.5 + rand(k + 3))) * 6
      const px = x + nx * life * reach + sway * Math.abs(ny)
      const py = y + ny * life * reach * 0.6 - life * reach
      const size = (1 - life * 0.85) * (5 + rand(k + 11) * 8)
      const heat = 1 - life
      const color = heat > 0.7 ? [255, 210, 90] : heat > 0.35 ? [255, 110, 20] : [190, 30, 5]
      const blob = g.createRadialGradient(px, py, 0, px, py, size)
      blob.addColorStop(0, `rgba(${color},${0.42 * heat + 0.05})`); blob.addColorStop(1, `rgba(${color},0)`)
      g.fillStyle = blob; g.beginPath(); g.ellipse(px, py, size * 0.7, size * 1.3, 0, 0, TAU); g.fill()
    }
    for (let k = 0; k < 40; k++) {
      const life = (t * 2 + rand(k)) % 1
      const [x, y] = onEdge(rand(k + 50), H + 10)
      const px = x + Math.sin(TAU * (life + k * 0.1)) * 12, py = y - 20 - life * 110
      g.fillStyle = `rgba(255,${150 + rand(k) * 90 | 0},60,${(1 - life) * 0.95})`
      g.shadowColor = "#ff7a00"; g.shadowBlur = 10
      g.beginPath(); g.arc(px, py, 1.6 + rand(k + 3) * 2, 0, TAU); g.fill()
    }
    g.restore()
    metal(H + 6, 16, ["#2a0c03", "#5c1a06", "#1a0602", "#6b2408", "#2a0c03"], TAU * t)
    g.save(); square(H + 6); g.lineWidth = 2.5; g.strokeStyle = "#ffb347"; g.shadowColor = "#ff6a00"; g.shadowBlur = 16; g.stroke(); g.restore()
    for (const [sx, sy] of [[-1, -1], [1, -1], [1, 1], [-1, 1]]) {
      const x = C + sx * (H + 6), y = C + sy * (H + 6)
      const grad = g.createRadialGradient(x, y, 2, x, y, 20); grad.addColorStop(0, "#fff4c2"); grad.addColorStop(0.4, "#ff7a00"); grad.addColorStop(1, "#5c1a06")
      g.save(); g.fillStyle = grad; g.shadowColor = "#ff5a00"; g.shadowBlur = 24 + 10 * Math.sin(TAU * (t * 2 + sx * 0.25 + sy * 0.5))
      g.beginPath(); g.moveTo(x, y - 18); g.lineTo(x + 14, y); g.lineTo(x, y + 18); g.lineTo(x - 14, y); g.closePath(); g.fill(); g.restore()
    }
  },

  /** Celestial Crown: a double gold border with a moving shine, a jewelled crown on top and stars circling it. */
  "celestial-crown"(t) {
    const gold = ["#7a5200", "#d4a017", "#fff1b8", "#d4a017", "#7a5200", "#d4a017", "#fff1b8", "#d4a017", "#7a5200"]
    metal(H + 14, 9, gold, TAU * t)
    metal(H + 1, 5, gold, TAU * t + Math.PI)
    // Laurel along the bottom.
    for (let i = 0; i < 14; i++) {
      const side = i < 7 ? -1 : 1, n = i % 7
      const x = C + side * (40 + n * 22), y = C + H + 14 - n * 3
      g.save(); g.translate(x, y); g.rotate(side * (0.5 + n * 0.08)); g.fillStyle = n % 2 ? "#e6b422" : "#b8860b"; g.shadowColor = "#ffd76a"; g.shadowBlur = 6
      g.beginPath(); g.ellipse(0, 0, 13, 5.5, 0, 0, TAU); g.fill(); g.restore()
    }
    // The crown.
    g.save(); g.translate(C, C - H - 12); g.scale(0.88, 0.88)
    const crown = g.createLinearGradient(0, -60, 0, 10); crown.addColorStop(0, "#fff6cf"); crown.addColorStop(0.5, "#e2b23a"); crown.addColorStop(1, "#8a6000")
    g.fillStyle = crown; g.shadowColor = "#ffd76a"; g.shadowBlur = 22
    g.beginPath(); g.moveTo(-58, 10); g.lineTo(-64, -34); g.lineTo(-32, -10); g.lineTo(0, -56); g.lineTo(32, -10); g.lineTo(64, -34); g.lineTo(58, 10); g.closePath(); g.fill()
    g.shadowBlur = 0; g.fillStyle = "#8a6000"; g.fillRect(-58, 2, 116, 8)
    for (const [x, y, color] of [[-64, -34, "#e11d48"], [0, -56, "#38bdf8"], [64, -34, "#e11d48"], [-24, 6, "#22c55e"], [24, 6, "#22c55e"], [0, 6, "#a855f7"]]) {
      g.fillStyle = color; g.shadowColor = color; g.shadowBlur = 10 + 6 * Math.sin(TAU * (t * 2 + x * 0.01))
      g.beginPath(); g.arc(x, y, 6, 0, TAU); g.fill()
    }
    g.restore()
    for (let i = 0; i < 9; i++) {
      const [x, y, nx, ny] = onEdge(t + i / 9, H + 30)
      const tw = 0.5 + 0.5 * Math.sin(TAU * (t * 3 + i * 0.37))
      star(x + nx * 4, y + ny * 4, 5 + tw * 6, "#fffbe6", "#ffd76a")
    }
  },

  /** Void Rift: a violet vortex circling the picture, lightning jumping across it. */
  "void-rift"(t) {
    g.save(); ring(H + 26, R + 18, H - 4); g.fillStyle = "rgba(20,4,40,0.85)"; g.fill("evenodd"); g.restore()
    g.save(); g.globalCompositeOperation = "lighter"
    for (let i = 0; i < 6; i++) {
      square(H + 6 + i * 3.5, R + i)
      g.setLineDash([60 + i * 22, 40 + i * 15]); g.lineDashOffset = -(t * (i % 2 ? 1 : -1) * (2400 + i * 400))
      g.lineWidth = 3.5 - i * 0.4; g.strokeStyle = i % 2 ? "rgba(217,70,239,0.85)" : "rgba(139,92,246,0.9)"; g.shadowColor = "#a855f7"; g.shadowBlur = 18; g.stroke()
    }
    g.setLineDash([])
    const step = Math.floor(t * 12)
    for (let b = 0; b < 3; b++) {
      const seed = step * 7 + b
      const s0 = rand(seed), s1 = s0 + 0.08 + rand(seed + 1) * 0.12
      const [x0, y0] = onEdge(s0, H + 8), [x1, y1] = onEdge(s1, H + 8)
      g.strokeStyle = "rgba(240,220,255,0.95)"; g.lineWidth = 2; g.shadowColor = "#c084fc"; g.shadowBlur = 20
      g.beginPath(); g.moveTo(x0, y0)
      for (let j = 1; j < 8; j++) { const f = j / 8; g.lineTo(x0 + (x1 - x0) * f + (rand(seed + j * 3) - 0.5) * 26, y0 + (y1 - y0) * f + (rand(seed + j * 5) - 0.5) * 26) }
      g.lineTo(x1, y1); g.stroke()
    }
    for (let i = 0; i < 30; i++) {
      const [x, y, nx, ny] = onEdge(rand(i) + t * (i % 2 ? 1 : -1), H + 14 + rand(i + 4) * 20)
      g.fillStyle = `rgba(216,180,254,${0.4 + 0.6 * Math.abs(Math.sin(TAU * (t * 2 + i * 0.3)))})`; g.shadowBlur = 8
      g.beginPath(); g.arc(x + nx * 4, y + ny * 4, 1.6 + rand(i + 2) * 2, 0, TAU); g.fill()
    }
    g.restore()
    g.save(); square(H - 2); g.lineWidth = 2; g.strokeStyle = "#e9d5ff"; g.shadowColor = "#a855f7"; g.shadowBlur = 14; g.stroke(); g.restore()
  },

  /** Frost Royale: ice shards around the picture, a shimmer running over them and snow drifting down. */
  "frost-royale"(t) {
    metal(H + 6, 12, ["#0c4a6e", "#7dd3fc", "#f0f9ff", "#38bdf8", "#0c4a6e"], TAU * t)
    for (let k = 0; k < 64; k++) {
      const [x, y, nx, ny] = onEdge(k / 64 + 0.004, H + 12)
      const len = 14 + rand(k) * 30 + (k % 8 === 0 ? 22 : 0)
      const w = 6 + rand(k + 1) * 6
      const shine = Math.max(0, Math.cos(TAU * (k / 64 - t))) ** 8
      const grad = g.createLinearGradient(x, y, x + nx * len, y + ny * len)
      grad.addColorStop(0, `rgba(${200 + shine * 55},${235 + shine * 20},255,0.95)`); grad.addColorStop(1, "rgba(125,211,252,0.15)")
      g.save(); g.fillStyle = grad; g.shadowColor = "#7dd3fc"; g.shadowBlur = 8 + shine * 20
      g.beginPath(); g.moveTo(x - ny * w, y + nx * w); g.lineTo(x + nx * len, y + ny * len); g.lineTo(x + ny * w, y - nx * w); g.closePath(); g.fill(); g.restore()
    }
    for (let i = 0; i < 26; i++) {
      const fall = (t + rand(i)) % 1
      const x = 40 + rand(i + 7) * 432 + Math.sin(TAU * (fall + i * 0.2)) * 10
      const y = -10 + fall * 532
      const inside = Math.abs(x - C) < H - 10 && Math.abs(y - C) < H - 10
      if (inside) continue
      g.save(); g.translate(x, y); g.rotate(TAU * fall); g.strokeStyle = "rgba(240,249,255,0.9)"; g.lineWidth = 1.6; g.shadowColor = "#bae6fd"; g.shadowBlur = 6
      const r = 4 + rand(i + 1) * 4
      for (let a = 0; a < 3; a++) { g.rotate(Math.PI / 3); g.beginPath(); g.moveTo(-r, 0); g.lineTo(r, 0); g.stroke() }
      g.restore()
    }
  },

  /** Hologram: a rainbow border turning round the picture, a scan line passing over and the odd glitch. */
  "hologram"(t) {
    const grad = g.createConicGradient(TAU * t, C, C)
    ;["#ff004c", "#ff9a00", "#ffe600", "#29ff6b", "#00d4ff", "#7a5cff", "#ff00d4", "#ff004c"].forEach((color, i, all) => grad.addColorStop(i / (all.length - 1), color))
    g.save(); square(H + 8); g.lineWidth = 14; g.strokeStyle = grad; g.shadowColor = "#ffffff"; g.shadowBlur = 18; g.stroke(); g.restore()
    g.save(); square(H + 22, R + 12); g.lineWidth = 3; g.strokeStyle = grad; g.globalAlpha = 0.6; g.stroke(); g.restore()
    g.save(); square(H - 1); g.lineWidth = 1.5; g.strokeStyle = "rgba(255,255,255,0.9)"; g.stroke(); g.restore()
    const scan = -40 + ((t * 2) % 1) * 600
    g.save(); ring(H + 30, R + 16, H - 3); g.clip("evenodd")
    const sl = g.createLinearGradient(0, scan - 30, 0, scan + 30); sl.addColorStop(0, "rgba(255,255,255,0)"); sl.addColorStop(0.5, "rgba(255,255,255,0.85)"); sl.addColorStop(1, "rgba(255,255,255,0)")
    g.fillStyle = sl; g.fillRect(0, scan - 30, 512, 60)
    for (let y = 30; y < 490; y += 6) { g.fillStyle = "rgba(0,0,0,0.18)"; g.fillRect(0, y, 512, 2) }
    g.restore()
    const step = Math.floor(t * 16)
    if (step % 4 === 1) {
      for (let i = 0; i < 4; i++) {
        const [x, y] = onEdge(rand(step * 9 + i), H + 8)
        g.fillStyle = ["rgba(0,212,255,0.8)", "rgba(255,0,212,0.8)"][i % 2]
        g.fillRect(x - 18 + rand(i + step) * 10, y - 4, 22 + rand(step + i * 2) * 26, 6)
      }
    }
  },

  /** Diamond Prestige: a platinum border with a cut diamond at each corner and glints running round. */
  "diamond-prestige"(t) {
    metal(H + 10, 11, ["#4b5563", "#e5e7eb", "#ffffff", "#9ca3af", "#f3f4f6", "#6b7280"], TAU * t)
    metal(H - 1, 3, ["#9ca3af", "#ffffff", "#9ca3af"], -TAU * t)
    for (const [sx, sy, i] of [[-1, -1, 0], [1, -1, 1], [1, 1, 2], [-1, 1, 3]]) {
      const x = C + sx * (H + 10), y = C + sy * (H + 10)
      g.save(); g.translate(x, y); g.rotate(Math.PI / 4 * (sx * sy))
      const s = 30
      const facets = [[0, -s, s * 0.7, -s * 0.2, 0, 0, "#f8fafc"], [s * 0.7, -s * 0.2, s * 0.45, s * 0.6, 0, 0, "#cbd5e1"], [s * 0.45, s * 0.6, -s * 0.45, s * 0.6, 0, 0, "#94a3b8"], [-s * 0.45, s * 0.6, -s * 0.7, -s * 0.2, 0, 0, "#e2e8f0"], [-s * 0.7, -s * 0.2, 0, -s, 0, 0, "#ffffff"]]
      g.shadowColor = "#e0f2fe"; g.shadowBlur = 18
      for (const [ax, ay, bx, by, cx, cy, color] of facets) { g.fillStyle = color; g.beginPath(); g.moveTo(ax, ay); g.lineTo(bx, by); g.lineTo(cx, cy); g.closePath(); g.fill() }
      g.strokeStyle = "rgba(255,255,255,0.9)"; g.lineWidth = 1.2; g.beginPath(); g.moveTo(0, -s); g.lineTo(s * 0.7, -s * 0.2); g.lineTo(s * 0.45, s * 0.6); g.lineTo(-s * 0.45, s * 0.6); g.lineTo(-s * 0.7, -s * 0.2); g.closePath(); g.stroke()
      g.restore()
      const flash = Math.max(0, Math.sin(TAU * (t - i * 0.25))) ** 12
      if (flash > 0.02) star(x + sx * -4, y + sy * -6, 8 + flash * 18, `rgba(255,255,255,${flash})`, "#bae6fd")
    }
    for (let i = 0; i < 3; i++) {
      const [x, y, nx, ny] = onEdge(t + i / 3 + 0.08, H + 10)
      star(x + nx * 2, y + ny * 2, 9, "#ffffff", "#e0f2fe")
    }
  },
}

// Nothing is ever drawn over the picture: the opening is cleared after each design (sparks, snow and glows stop at its edge).
window.draw = (name, t) => {
  g.clearRect(0, 0, 512, 512)
  designs[name](t)
  g.save(); g.globalCompositeOperation = "destination-out"; square(H - 6, R - 6); g.fill(); g.restore()
  return c.toDataURL("image/png")
}
window.names = Object.keys(designs)
</script>
</body>
