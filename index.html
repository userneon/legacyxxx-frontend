    <script>
      // Website preferences (Settings → Website) are per device and applied before first paint.
      try {
        var prefs = JSON.parse(localStorage.getItem("legacyx:website") || "{}")
        if (prefs.motion === "reduce" || prefs.motion === "full") document.documentElement.dataset.motion = prefs.motion
      } catch (error) {}
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
