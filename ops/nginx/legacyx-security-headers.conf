# Security headers for the website. nginx drops the server-level add_header lines in any location that has its own
# add_header, so legacyx-frontend.conf includes this file in the server block and again in each such location.
#
#   sudo cp ops/nginx/legacyx-security-headers.conf /etc/nginx/snippets/
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Strict-Transport-Security "max-age=31536000" always;
# Content-Security-Policy, in report-only mode first: browsers log anything it would block in the console (F12) but block nothing.
# Browse the whole site (Home, Play, Skinchanger, Profile, Staff, sign-in) with the console open; when no "[Report Only]" line
# appears, change the header name below to Content-Security-Policy.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https://api.legacyx.cc; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
