# Security headers for the website. nginx drops the server-level add_header lines in any location that has its own
# add_header, so legacyx-frontend.conf includes this file in the server block and again in each such location.
#
#   sudo cp ops/nginx/legacyx-security-headers.conf /etc/nginx/snippets/
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Strict-Transport-Security "max-age=31536000" always;
