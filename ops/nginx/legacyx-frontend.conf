# Include from the legacyx.cc server block (next to your ssl_* / certbot lines):
#
#   server {
#       server_name legacyx.cc www.legacyx.cc;
#       root /var/www/legacyx;          # WEB_ROOT in ops/deploy.sh
#       include /etc/nginx/snippets/legacyx-frontend.conf;
#       ...
#   }
#
# Copy it once: sudo cp ops/nginx/legacyx-frontend.conf /etc/nginx/snippets/

index index.html;

# Content-hashed build output (Vite): cache forever.
location /assets/ {
    try_files $uri =404;
    access_log off;
    expires 365d;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

# index.html must always be fresh, or players keep an old build after a deploy.
location = /index.html {
    add_header Cache-Control "no-cache" always;
}

# Single-page app: /leaders, /profile/<id>, /play/fun ... all load index.html.
location / {
    try_files $uri $uri/ /index.html;
}
