# Include from the legacyx.cc server block (next to your ssl_* / certbot lines):
#
#   server {
#       server_name legacyx.cc www.legacyx.cc;
#       root /var/www/legacyx;          # WEB_ROOT in ops/deploy.sh
#       include /etc/nginx/snippets/legacyx-frontend.conf;
#       ...
#   }
#
# Copy it once: sudo cp ops/nginx/legacyx-frontend.conf /etc/nginx/snippets/

index index.html;

# Security headers (copy ops/nginx/legacyx-security-headers.conf to /etc/nginx/snippets/ too).
include /etc/nginx/snippets/legacyx-security-headers.conf;

# Content-hashed build output (Vite): cache forever.
location /assets/ {
    try_files $uri =404;
    access_log off;
    expires 365d;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    include /etc/nginx/snippets/legacyx-security-headers.conf;
}

# index.html must always be fresh, or players keep an old build after a deploy.
location = /index.html {
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/snippets/legacyx-security-headers.conf;
}

# Steam OpenID returns to legacyx.cc/api/v1/auth/steam/callback (STEAM_OPENID_ORIGIN on the API), so
# this host must hand those paths to the Root API. Without it the SPA fallback below serves index.html
# for the callback and login never completes.
location ^~ /api/v1/auth/steam {
    proxy_pass https://api.legacyx.cc;
    proxy_ssl_server_name on;
    proxy_set_header Host api.legacyx.cc;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

# Single-page app: /leaders, /profile/<id>, /play/fun ... all load index.html.
location / {
    try_files $uri $uri/ /index.html;
}
