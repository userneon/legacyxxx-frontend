# Include from the production LEGACY-X Nginx server block. Images are served directly
# from static storage/CDN, never proxied through the application API.
location ~* ^/(?:assets|images|manus-storage)/.+\.(?:avif|webp|png|jpe?g|gif)$ {
    try_files $uri =404;
    access_log off;
    etag on;
    expires 365d;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Vary "Accept-Encoding" always;
}

# Keep the manifest short-lived: it maps logical image IDs to immutable, content-hashed URLs.
location = /assets/image-manifest.json {
    try_files $uri =404;
    access_log off;
    etag on;
    expires 5m;
    add_header Cache-Control "public, max-age=300, must-revalidate" always;
}
