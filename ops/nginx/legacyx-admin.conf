# The staff site, admin.legacyx.cc (owner request 2026-10-23). Add DNS for admin.legacyx.cc, get a certificate for it
# (sudo certbot --nginx -d admin.legacyx.cc), then put this in sites-available next to the legacyx.cc block:
#
#   server {
#       server_name admin.legacyx.cc;
#       root /var/www/legacyx-admin;          # ADMIN_WEB_ROOT in ops/deploy-admin.sh
#       include /etc/nginx/snippets/legacyx-admin.conf;
#       # listen 443 ssl; ssl_certificate ...   (certbot adds these)
#   }
#
# Copy it once: sudo cp ops/nginx/legacyx-admin.conf /etc/nginx/snippets/
# The API needs ADMIN_ORIGIN=https://admin.legacyx.cc in its environment (VPS_DEPLOY.md in legacyxxx-backend); the session
# cookies are on .legacyx.cc, so signing in on either site signs in on both.

index index.html;

# Compress the text the site is made of. Without this the 985 KB bundle and the 307 KB stylesheet went out as they are (a phone on a slow
# connection waited about 10 seconds for a refresh); gzip takes them to roughly a quarter. Pictures (webp, png) are already compressed.
gzip on;
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_proxied any;
gzip_types text/plain text/css text/xml application/json application/javascript text/javascript application/xml image/svg+xml font/ttf application/wasm;

include /etc/nginx/snippets/legacyx-security-headers.conf;
# Staff pages are never for search engines.
add_header X-Robots-Tag "noindex, nofollow" always;

location /assets/ {
    try_files $uri =404;
    access_log off;
    expires 365d;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    include /etc/nginx/snippets/legacyx-security-headers.conf;
}

location = /index.html {
    add_header Cache-Control "no-cache" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    include /etc/nginx/snippets/legacyx-security-headers.conf;
}

location = /robots.txt {
    default_type text/plain;
    return 200 "User-agent: *\nDisallow: /\n";
}

# Single-page app: /staff, /staff/checks ... all load index.html.
location / {
    try_files $uri $uri/ /index.html;
}
